name: NATIX quality checks
on:
  push:
    branches: [main, natix-marketplace-v2]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q main.py natix
      - name: Discord UI + storage smoke tests
        run: |
          python - <<'PY'
          from natix.db import Store
          from natix.assets import CATEGORIES, PANELS, banner, emoji
          from natix.panels import Panel, TicketControls, GiveawayPanel, CatalogView
          from natix.bot import Natix
          db=Store(":memory:")
          db.configure(1,name="NATIX",staff=42,category=5)
          assert db.settings(1)["staff"]==42
          assert db.settings(2)["staff"]==0
          pid=db.add_product(1,"nitro","Nitro Test","Example item","10 EUR",2)
          assert db.product(1,pid)["stock"]==2
          assert db.deduct_stock(1,pid,1)
          assert db.product(1,pid)["stock"]==1
          assert not db.deduct_stock(1,pid,2)
          oid=db.create_order(1,100,db.product(1,pid),1,"test")
          assert db.order(1,oid)["state"]=="pending"
          assert db.order_state(1,oid,"accepted",999)
          pid_stock=db.add_product(1,"nitro","Stocked","In stock","20 EUR",2)
          order_stock=db.create_order(1,101,db.product(1,pid_stock),1)
          ok,why=db.transition_order(1,order_stock,"delivered",900)
          assert not ok and db.product(1,pid_stock)["stock"]==2,why
          assert db.transition_order(1,order_stock,"accepted",900)[0]
          assert db.transition_order(1,order_stock,"processing",900)[0]
          assert db.transition_order(1,order_stock,"delivered",900)[0]
          assert db.product(1,pid_stock)["stock"]==1
          assert db.transition_order(1,order_stock,"delivered",900)[0]
          assert db.product(1,pid_stock)["stock"]==1
          canceled=db.create_order(1,102,db.product(1,pid_stock),1)
          assert db.transition_order(1,canceled,"cancelled",900)[0]
          assert not db.transition_order(1,canceled,"delivered",900)[0]
          assert db.order(2,order_stock) is None
          assert not db.transition_order(2,order_stock,"cancelled",900)[0]
          db.attach_order_ticket(1,oid,123)
          assert db.order(1,oid)["channel"]==123
          db.create_ticket(123,1,100,"order")
          assert db.active_ticket(1,100,"order")["channel"]==123
          assert len(CATEGORIES)==6
          for name in PANELS:
              view=Panel(name,db)
              assert view.is_persistent(),name
              assert len(view.children)>0,name
              assert all(len(box.children)<=10 for box in view.children),name
              assert sum(len(box.children) for box in view.children)<=30,name
          assert TicketControls().is_persistent()
          assert GiveawayPanel().is_persistent()
          catalog=CatalogView(db.products(1,"nitro"),"nitro")
          assert catalog.is_persistent()
          assert catalog.children
          assert all(len(box.children)<=10 for box in catalog.children)
          assert banner("NATIX").read(8)==b"\x89PNG\r\n\x1a\n"
          for name in ("shop","gift","ticket","trade","support","star","shield"):
              assert emoji(name).startswith(b"\x89PNG")
          pid2=db.create_custom_panel(1,"CUSTOM","My panel")
          for n in range(6):
              db.create_custom_item(pid2,"Item "+str(n),"Description","ticket","support","🎟️")
          from natix.panels import CustomPanel
          custom=CustomPanel(db,db.custom_panel(1,pid2))
          assert custom.is_persistent()
          assert all(len(box.children)<=10 for box in custom.children)
          assert sum(len(box.children) for box in custom.children)<=30
          # Validate the serialized Discord API payload, not only local classes.
          for candidate in [*(Panel(name,db) for name in PANELS),catalog,custom]:
              components=candidate.to_components()
              assert 1<=len(components)<=10
              for component in components:
                  assert component["type"]==17
                  assert len(component["components"])<=10, component
              assert len(components)<=10
          # Eight products should still serialize into multiple safe containers.
          for k in range(9):
              db.add_product(1,"other","Item "+str(k),"Description","5 EUR",2)
          dense=CatalogView(db.products(1,"other"),"other")
          assert len(dense.to_components())>=2
          assert all(len(box["components"])<=10 for box in dense.to_components())
          page,total=db.products_page(1,"other",0,6)
          assert len(page)==6 and total==9
          page2,total2=db.products_page(1,"other",1,6)
          assert len(page2)==3 and total2==9
          nav=CatalogView(page,"other",0,total)
          assert all(len(box["components"])<=10 for box in nav.to_components())
          serialized=str(nav.to_components())
          assert "Suivant" in serialized
          assert "natix:catalog:other:1" in serialized
          client=Natix(store=db)
          assert len(client.tree.get_commands())>=20
          assert not client.intents.message_content
          print("NATIX tests passed: commands",len(client.tree.get_commands()),"panels",len(PANELS))
          PY
