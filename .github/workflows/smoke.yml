name: NATIX quality checks
on:
  push:
    branches: [main, natix-marketplace-v2]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q main.py natix
      - name: Discord UI + storage smoke tests
        run: |
          python - <<'PY'
          from natix.db import Store
          from natix.assets import CATEGORIES, PANELS, banner, emoji
          from natix.panels import Panel, TicketControls, GiveawayPanel, CatalogView
          from natix.bot import Natix
          db=Store(":memory:")
          db.configure(1,name="NATIX",staff=42,category=5)
          assert db.settings(1)["staff"]==42
          assert db.settings(2)["staff"]==0
          pid=db.add_product(1,"nitro","Nitro Test","Example item","10 EUR",2)
          assert db.product(1,pid)["stock"]==2
          assert db.deduct_stock(1,pid,1)
          assert db.product(1,pid)["stock"]==1
          assert not db.deduct_stock(1,pid,2)
          oid=db.create_order(1,100,db.product(1,pid),1,"test")
          assert db.order(1,oid)["state"]=="pending"
          assert db.order_state(1,oid,"accepted",999)
          db.create_ticket(123,1,100,"order")
          assert db.active_ticket(1,100,"order")["channel"]==123
          assert len(CATEGORIES)==6
          for name in PANELS:
              view=Panel(name,db)
              assert view.is_persistent(),name
              assert len(view.children)>0,name
              assert all(len(box.children)<=10 for box in view.children),name
              assert sum(len(box.children) for box in view.children)<=30,name
          assert TicketControls().is_persistent()
          assert GiveawayPanel().is_persistent()
          catalog=CatalogView(db.products(1,"nitro"),"nitro")
          assert catalog.is_persistent()
          assert catalog.children
          assert all(len(box.children)<=10 for box in catalog.children)
          assert banner("NATIX").read(8)==b"\x89PNG\r\n\x1a\n"
          for name in ("shop","gift","ticket","trade","support","star","shield"):
              assert emoji(name).startswith(b"\x89PNG")
          pid2=db.create_custom_panel(1,"CUSTOM","My panel")
          for n in range(6):
              db.create_custom_item(pid2,"Item "+str(n),"Description","ticket","support","🎟️")
          from natix.panels import CustomPanel
          custom=CustomPanel(db,db.custom_panel(1,pid2))
          assert custom.is_persistent()
          assert all(len(box.children)<=10 for box in custom.children)
          assert sum(len(box.children) for box in custom.children)<=30
          client=Natix(store=db)
          assert len(client.tree.get_commands())>=20
          assert not client.intents.message_content
          print("NATIX tests passed: commands",len(client.tree.get_commands()),"panels",len(PANELS))
          PY
